 <section class="page-header">

    <h1>Contact Us</h1>

    <p>
        We'd love to hear from you.
    </p>

 </section>



 <section class="contact-page">



    <div class="contact-details">

        <h2>Get In Touch</h2>

        <p>📍 Nepal</p>

        <p>📞 +977 9841369370</p>

        <p>✉️ info@samariutthansewa.org</p>

    </div>


    <form id="contactForm" novalidate>

        <label for="name">Your Name</label>
        <input
           type="text"
           id="name"
           placeholder="Your Name"
           required>

        <label for="email">Your Email</label>   
        <input
           type="email"
           id="email"
           placeholder="Your Email"
           required>
        <label for="subject">Subject</label>
        <input
           type="text"
           id="subject"
           placeholder="subject"
           required>

        <label for="message">Your message</label>
        <textarea
            id="message"
            placeholder="Your Message"
            rows="6"
            maxlength="500"
            required></textarea>

            <p id="characterCount">characters: 0 / 500</p>

        <button type="submit">
            Send Message
        </button>

        <p id="formMessage"></p>

    </form>


 </section>
